name: ConquerX Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.3 with Android export templates
        uses: firebelley/godot-setup-action@v2
        with:
          version: 4.3.0
          export-templates: true
          use-dotnet: false

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Configure Godot Android SDK paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF

      - name: Export Android debug APK
        run: |
          mkdir -p build
          godot --headless --path . --editor --quit
          godot --headless --path . --export-debug "Android" build/ConquerX.apk

      - name: Verify APK
        run: |
          test -s build/ConquerX.apk
          file build/ConquerX.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ConquerX-Android-APK
          path: build/ConquerX.apk
          if-no-files-found: error
          retention-days: 14
