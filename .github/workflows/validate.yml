name: ConquerX Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Validate server and gameplay integration
        run: npm run check
